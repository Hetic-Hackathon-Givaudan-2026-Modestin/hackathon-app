# La stack de développement. Versions figées : les mêmes qu'en production.
name: hackathon

services:
  # Le poste de travail : VS Code s'y attache, on y lance l'API et le front
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: >-
      sh -c "npm ci &&
      npm run build -w api &&
      npm run migrate -w api &&
      npm run dev"
    volumes:
      - .:/workspace:cached
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      # Les données, dans un dossier du projet (ignoré par git)
      - ./db/data:/var/lib/postgresql/data
      # Schéma et données de test, joués au premier démarrage
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
