openapi: 3.1.1
info:
  title: Hackathon API
  version: 0.1.0
  description: API utilisée par le front pour vérifier le service et gérer les questions.
servers:
  - url: http://localhost:3000
    description: Développement local
paths:
  /api/health:
    get:
      summary: Vérifie la connexion à la base de données
      operationId: getHealth
      responses:
        '200':
          description: API et base de données disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/questions:
    get:
      summary: Liste les dix dernières questions enregistrées
      operationId: listQuestions
      responses:
        '200':
          description: Questions, de la plus récente à la plus ancienne
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
    post:
      summary: Envoie une question au service IA et enregistre la réponse
      operationId: createQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: Question et réponse enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Question absente ou vide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Échec de l'appel au service IA ou de l'enregistrement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
          const: ok
        db:
          type: string
          description: Version renvoyée par PostgreSQL.
    CreateQuestionRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          description: Question de l'utilisateur.
    Question:
      type: object
      required:
        - id
        - question
        - answer
        - created_at
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
