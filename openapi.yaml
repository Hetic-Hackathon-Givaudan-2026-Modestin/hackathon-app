openapi: 3.1.1
info:
  title: Hackathon API
  version: 0.1.0
  description: API utilisée par le front pour gérer les comptes et les questions.
servers:
  - url: http://localhost:3000
    description: Développement local
paths:
  /api/session:
    post:
      summary: Ouvre une session de 12 heures
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Session créée ; cookie HttpOnly, SameSite Strict et Secure en production.
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          description: Données invalides
        '401':
          description: Identifiants incorrects
        '403':
          description: Requête refusée
        '429':
          description: Trop de tentatives de connexion
    get:
      summary: Retourne le profil de la session active
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Profil connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Session absente ou expirée
    delete:
      summary: Déconnecte et invalide la session
      operationId: deleteSession
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Session supprimée
        '403':
          description: Requête refusée
  /api/users:
    post:
      summary: Crée un compte utilisateur sans ouvrir de session
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Informations invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Adresse email déjà utilisée, sans distinction de casse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur lors de la création du compte
  /api/health:
    get:
      summary: Vérifie la connexion à la base de données
      operationId: getHealth
      responses:
        '200':
          description: API et base de données disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/questions:
    get:
      summary: Liste les dix dernières questions enregistrées
      operationId: listQuestions
      responses:
        '200':
          description: Questions, de la plus récente à la plus ancienne
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
    post:
      summary: Envoie une question au service IA et enregistre la réponse
      operationId: createQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: Question et réponse enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Question absente ou vide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Échec de l'appel au service IA ou de l'enregistrement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/projects:
    post:
      summary: Dépose un projet, l'évalue et l'enregistre
      description: >-
        Un client déjà passé chez Givaudan est accepté directement. Sinon le
        projet (sans nom, email ni entreprise) est envoyé au service de scoring, qui
        retourne un score de 0 à 100 ; à partir de 65, le projet est accepté,
        sinon refusé. Si l'évaluation échoue, le projet reste en attente.
        Le jeton d'accès n'est retourné qu'ici.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Projet enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedProject'
        '400':
          description: Informations invalides ; `fields` liste les champs en cause
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Le contenu n'est pas du JSON
        '429':
          description: Trop de projets envoyés depuis cette adresse
  /api/projects/{id}:
    get:
      summary: Retourne le statut d'un projet
      operationId: getProject
      security:
        - projectToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Statut du projet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Jeton absent ou invalide pour ce projet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/projects/{id}/chat:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrouve le brief et les messages d'un projet accepté
      security:
        - projectToken: []
      responses:
        '200':
          description: Brief et messages dans l'ordre chronologique
          content:
            application/json:
              schema:
                type: object
                required: [project, messages]
                properties:
                  project:
                    type: object
                    required:
                      - market
                      - productType
                      - budgetPerKg
                      - annualVolumeKg
                      - salesZone
                      - positioning
                      - projectStage
                      - launchTiming
                      - description
                    properties:
                      market: { type: string }
                      productType: { type: string }
                      budgetPerKg: { type: number, nullable: true }
                      annualVolumeKg: { type: number, nullable: true }
                      salesZone: { type: string }
                      positioning: { type: string }
                      projectStage: { type: string }
                      launchTiming: { type: string }
                      description: { type: string }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
        '401': { description: Jeton invalide }
        '403': { description: Projet non accepté }
    post:
      summary: Envoie un message à GivBot pour un projet accepté
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: Réponse de GivBot
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  answer: { type: string }
        '400': { description: Message invalide }
        '401': { description: Jeton invalide }
        '403': { description: Projet non accepté }
        '502': { description: Service IA indisponible ou réponse invalide }
components:
  securitySchemes:
    projectToken:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: givbot_session
  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    CreateProjectRequest:
      type: object
      required:
        - fullName
        - company
        - role
        - email
        - salesZone
        - market
        - productType
        - budgetPerKg
        - annualVolumeKg
        - positioning
        - projectStage
        - launchTiming
        - workedWithGivaudan
      properties:
        fullName: { type: string, maxLength: 200 }
        company: { type: string, maxLength: 200 }
        role:
          type: string
          enum: [rd, marketing, purchasing, management, other]
        email: { type: string, format: email, maxLength: 254 }
        salesZone:
          type: string
          enum: [france, europe, north-america, asia, other]
        market:
          type: string
          enum: [agro, perfume, beauty, home, other]
        productType: { type: string, minLength: 1, maxLength: 200 }
        budgetPerKg:
          type: number
          nullable: true
          exclusiveMinimum: 0
          maximum: 1000000
          description: Budget €/kg d’arôme ; null si non défini.
        annualVolumeKg:
          type: number
          nullable: true
          exclusiveMinimum: 0
          maximum: 1000000000
          description: Volume annuel acheté en kg d’arôme ; null si non défini.
        positioning:
          type: string
          enum: [entry, mid, premium]
        projectStage:
          type: string
          enum: [idea, development, testing, ready, launched, unknown]
        launchTiming:
          type: string
          enum: [under-6-months, 6-12-months, 1-2-years, over-2-years, unknown]
        workedWithGivaudan: { type: boolean }
      description: Le résumé transmis au scoring est généré par l'API depuis les réponses structurées.
    CreatedProject:
      type: object
      required: [id, status, accessToken]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        accessToken:
          type: string
          description: Secret à conserver côté client ; il n'est jamais renvoyé.
    Project:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        createdAt: { type: string, format: date-time }
    ProjectStatus:
      type: string
      enum: [pending, accepted, rejected]
    CreateUserRequest:
      type: object
      required: [fullName, email, company, sector, role, password]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          description: Les espaces en début et fin sont retirés.
        email:
          type: string
          format: email
          maxLength: 254
          description: Normalisé en minuscules après suppression des espaces autour.
        company:
          type: string
          minLength: 1
          maxLength: 200
        sector:
          type: string
          enum: [flavors, fragrance]
        role:
          type: string
          enum: [rd, marketing, purchasing, management, other]
        password:
          type: string
          minLength: 8
          maxLength: 256
          format: password
    User:
      type: object
      required: [id, fullName, email, company, sector, role, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        sector:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time
    Health:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
          const: ok
        db:
          type: string
          description: Version renvoyée par PostgreSQL.
    CreateQuestionRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          description: Question de l'utilisateur.
    Question:
      type: object
      required:
        - id
        - question
        - answer
        - created_at
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
